# Inti-Plasma: PostgreSQL + Web.Api (mobile/integrations) + Web.App (admin office, background jobs), one database
# and one attachment volume (W-12). Settings and secrets come from .env (see .env.example and docs/DEPLOY.md);
# docker-compose.override.yml turns this into the Visual Studio development setup.
services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-intiplasma}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-intiplasma};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # Web.App processes the outbox; the API only writes it.
      - BackgroundJobs__Enabled=false
      - FileStorage__RootPath=/app/uploads
    ports:
      - ${WEB_API_PORT:-5000}:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Admin office (MVC). Runs the background jobs (outbox, attachment cleanup) and shares the uploads volume.
  web-app:
    image: ${DOCKER_REGISTRY-}webapp
    container_name: web-app
    build:
      context: .
      dockerfile: src/Web.App/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-intiplasma};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - BackgroundJobs__Enabled=true
      - FileStorage__RootPath=/app/uploads
    ports:
      - ${WEB_APP_PORT:-5002}:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80

volumes:
  # Attachments (lampiran), shared by Web.Api and Web.App.
  uploads:
