services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    volumes:
      - ./.containers/uploads:/app/uploads

  # Admin office (MVC). Runs the background jobs (outbox, attachment cleanup) and shares the uploads volume.
  web-app:
    image: ${DOCKER_REGISTRY-}webapp
    container_name: web-app
    build:
      context: .
      dockerfile: src/Web.App/Dockerfile
    ports:
      - 5002:8080
    volumes:
      - ./.containers/uploads:/app/uploads

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      - POSTGRES_DB=intiplasma
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80
